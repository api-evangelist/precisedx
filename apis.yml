aid: precisedx
name: PreciseDx
description: 'PreciseDx is a New York-based AI digital pathology and oncology diagnostics
  company, founded out of the digital pathology program at Mount Sinai Health System.
  Its OncoIntelligence platform applies a patented Morphology Feature Array to
  hematoxylin and eosin (H&E) stained tissue images, combining AI-derived morphology
  features with clinicopathologic factors to produce an OncoIntelligence Score. The
  flagship test, PreciseBreast, stratifies early-stage breast cancer patients into
  high- and low-risk cohorts for disease recurrence up to 8.8 years, clinically
  validated across more than 1,600 cases, returning results in hours rather than the
  two to six weeks required for gene expression testing and at roughly 30 percent of
  the cost. PreciseDx operates CLIA-certified and CAP-accredited laboratories in New
  York City and Miami and is licensed in all 50 states. Test ordering for clinicians
  is handled through an authenticated web portal; the company publishes no public
  developer program, API documentation, or machine-readable API contract.'
